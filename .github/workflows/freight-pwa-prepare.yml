name: Prepare freight PWA manifests (temporary)
on:
  push:
    branches:
      - fix/freight-carrier-quotes-20261013
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/ci/generate-precache-manifest.mjs
      - name: Update manifest and service worker
        run: |
          set -eu
          git add assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): refresh freight guide asset revision'
          git push origin HEAD:fix/freight-carrier-quotes-20261013
