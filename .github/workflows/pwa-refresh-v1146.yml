name: Refresh V11.46 PWA artifacts
on:
  push:
    branches: [feat/local-dispatch-cost-adjustments-v11-46]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/local-dispatch-cost-adjustments-v11-46
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm run pwa:generate
      - name: Commit generated PWA artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then
            echo "PWA artifacts already current."
            exit 0
          fi
          git commit -m "chore(pwa): refresh V11.46.0 assets"
          git push origin HEAD:feat/local-dispatch-cost-adjustments-v11-46
