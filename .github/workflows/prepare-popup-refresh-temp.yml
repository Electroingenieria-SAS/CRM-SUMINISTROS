name: Preparar rediseño visual de modales
on:
  push:
    branches: [design/erp-popup-visual-refresh-20261104]
    paths: [.github/workflows/prepare-popup-refresh-temp.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/erp-popup-visual-refresh-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probar integridad de contratos y sintaxis
        run: |
          node --check assets/js/domains/receiving/order/stages/take.js
          node --check assets/js/modules/order-cancellation.js
          node --test scripts/tests/popup-design-refresh.test.mjs scripts/tests/receiving-order-certification.test.mjs scripts/tests/modal-flow-contracts.test.mjs
      - name: Generar manifiesto de recursos PWA
        run: npm run pwa:generate
      - name: Subir nueva versión para actualizar el diseño instalado
        shell: bash
        run: |
          set -euo pipefail
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pwa): integrar rediseño de modales al precaché"
          git push origin HEAD:design/erp-popup-visual-refresh-20261104
