name: Comprobar rediseño y regenerar PWA
on:
  push:
    branches: [design/erp-popup-visual-refresh-20261104]
    paths: [.github/workflows/prepare-popup-refresh-temp.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/erp-popup-visual-refresh-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnosticar arquitectura y contratos de modales
        shell: bash
        run: |
          set +e
          node scripts/validate.mjs > popup-validation-diagnostics.txt 2>&1
          printf '\n--- CSS ARCHITECTURE ---\n' >> popup-validation-diagnostics.txt
          node scripts/architecture/check-domain-boundaries.mjs >> popup-validation-diagnostics.txt 2>&1
          printf '\n--- MODAL TESTS ---\n' >> popup-validation-diagnostics.txt
          node --test scripts/tests/popup-design-refresh.test.mjs scripts/tests/receiving-order-certification.test.mjs scripts/tests/modal-flow-contracts.test.mjs >> popup-validation-diagnostics.txt 2>&1
          cat popup-validation-diagnostics.txt | tail -80
          exit 0
      - name: Regenerar manifiesto de recursos PWA
        run: npm run pwa:generate
      - name: Conservar diagnóstico y revisión para inspección
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ux
          mv popup-validation-diagnostics.txt docs/ux/popup-qa-diagnostics-temp.txt
          git add assets/precache-manifest.json service-worker.js docs/ux/popup-qa-diagnostics-temp.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pwa): actualizar estilos modulares y conservar diagnóstico temporal"
          git push origin HEAD:design/erp-popup-visual-refresh-20261104
