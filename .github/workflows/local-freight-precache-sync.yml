name: Local freight precache sync
on:
  push:
    branches:
      - feat/freight-type-local-picker-modal-20261014
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[precache-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Generate canonical PWA manifest and revision
        run: npm run pwa:generate
      - name: Push generated-only revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(pwa): synchronize local freight assets [precache-sync]"
          git push origin HEAD:feat/freight-type-local-picker-modal-20261014
