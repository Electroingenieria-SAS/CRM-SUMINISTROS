name: Validar kilometraje y actualizar PWA
on:
  push:
    branches: [fix/auto-shipping-kilometers-20261104]
    paths: [.github/workflows/shipping-distance-prepare-temp.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-shipping-kilometers-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pruebas de distancia automática y sintaxis
        run: |
          node --check assets/js/domains/logistics/shipping/actions/shipping-distance.js
          node --check assets/js/domains/logistics/shipping/actions/delivery-confirmation.js
          node --test scripts/tests/shipping-auto-distance.test.mjs
      - name: Regenerar assets PWA
        run: node scripts/ci/generate-precache-manifest.mjs
      - name: Subir revisión PWA
        shell: bash
        run: |
          set -euo pipefail
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pwa): actualizar archivos de kilometraje automático"
          git push origin HEAD:fix/auto-shipping-kilometers-20261104
