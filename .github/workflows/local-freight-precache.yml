name: Prepare local freight PWA and contracts (temporary)
on:
  push:
    branches: [feat/local-freight-ibarra-duvan-20261014]
permissions:
  contents: write
concurrency:
  group: local-freight-rate-precache
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test local freight CSV and dispatch contracts
        run: |
          node --test scripts/tests/local-dispatch-integration.test.mjs scripts/tests/local-freight-54-routes.test.mjs
          node --check assets/js/domains/freight-quotes/quote-view.js
          node --check assets/js/domains/freight-quotes/quote-controller.js
          node --check assets/js/domains/logistics/local-dispatch/local-dispatch-stage.js
      - name: Regenerate PWA
        run: |
          npm run pwa:generate
          npm run pwa:check
      - name: Publish precache revision to feature branch
        run: |
          set -eu
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): include local freight 54-route modules'
          git push origin HEAD:feat/local-freight-ibarra-duvan-20261014
