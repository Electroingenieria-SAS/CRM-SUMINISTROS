name: Refresh local tariff module PWA (temporary)
on:
  push:
    branches: [feat/local-freight-ibarra-duvan-20261014]
permissions:
  contents: write
concurrency:
  group: local-freight-rate-precache-r2
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate isolated data and PWA
        run: |
          node --test scripts/tests/local-dispatch-integration.test.mjs scripts/tests/local-freight-54-routes.test.mjs
          node scripts/architecture/check-domain-boundaries.mjs
          npm run pwa:generate
          npm run pwa:check
      - name: Commit generated precache
        run: |
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): record local tariffs as independent module'
          git push origin HEAD:feat/local-freight-ibarra-duvan-20261014
