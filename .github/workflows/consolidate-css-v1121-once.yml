name: Consolidate CSS V11.21 Once

on:
  push:
    branches: [architecture-cleanup-v11-21-0]

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: architecture-cleanup-v11-21-0
          fetch-depth: 0
      - name: Consolidate CSS preserving cascade order
        run: node scripts/consolidate-css-v1121.mjs
      - name: Commit generated canonical bundles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V11.21: consolidate 40 CSS layers into 4 canonical families'
          git push origin HEAD:architecture-cleanup-v11-21-0
