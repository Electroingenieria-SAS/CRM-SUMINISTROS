name: Probar creación universal de actividades
on:
  push:
    branches: [fix/workforce-new-activity-permissions-20261104]
    paths: [.github/workflows/workforce-new-activity-qa-temp.yml]
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workforce-new-activity-permissions-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxis e interacciones
        run: |
          node --check assets/js/domains/workforce/planner/planner-controller.js
          node --check assets/js/domains/workforce/planner/planner-shell.js
          node --check assets/js/domains/workforce/planner/planner-assignments.js
          node --check assets/js/domains/workforce/planner/assignment-wizard.js
          node --check assets/js/domains/workforce/planner/assignment-schedule-step.js
          node --test scripts/tests/workforce-new-activity-permissions.test.mjs
          node scripts/workforce-planner-test.mjs
          node scripts/workforce-catalog-hierarchy-test.mjs
      - name: Generar manifiesto PWA
        run: node scripts/ci/generate-precache-manifest.mjs
      - name: Guardar nueva revisión de recursos
        shell: bash
        run: |
          set -euo pipefail
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pwa): nuevos permisos de actividades y cronograma"
          git push origin HEAD:fix/workforce-new-activity-permissions-20261104
