name: Build pinned CRM motion ESM (temporary)
on:
  push:
    branches:
      - feat/freight-motion-system-20261014
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install pinned motion libraries and local build tool
        run: |
          npm install --save-exact motion@14.2.0 @formkit/auto-animate@0.10.0 @floating-ui/dom@1.8.0
          npm install --save-dev --save-exact esbuild@0.25.12
      - name: Bundle local browser ESM libraries
        run: npm run motion:bundle
      - name: Regenerate PWA hashes and enforce budgets
        run: |
          npm run pwa:generate
          npm run pwa:check
      - name: Commit reproducible vendor assets and lockfile
        run: |
          set -eu
          git add package.json package-lock.json assets/js/shared/motion/vendor-motion.js assets/js/shared/motion/vendor-auto-animate.js assets/js/shared/motion/vendor-floating-ui.js assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(motion): pin libraries and publish same-origin ESM with PWA'
          git push origin HEAD:feat/freight-motion-system-20261014
