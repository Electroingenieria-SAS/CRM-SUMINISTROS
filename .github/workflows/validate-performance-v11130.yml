name: Validate CRM Suministros V11.13.0 People Analytics

on:
  push:
    branches: [performance-analytics-v11-13-0]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/modules/flow-performance-v11130.js
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate V11.13.0 release contract
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/js/modules/flow-performance-v11130.js
          test -s assets/css/flow-performance-v11130.css
          test -s supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          grep -q 'version: "11.13.0"' assets/js/config.js
          grep -q 'build: "2026-09-07.06"' assets/js/config.js
          grep -q 'flow-performance-v11130.css?v=11.13.0' index.html
          grep -q 'flow-performance-v11130.js?v=11.13.0' index.html
          grep -q 'main.js?v=11.13.0' index.html
          grep -q 'crm-suministros-v11-13-0-20260907' service-worker.js
          grep -q './assets/css/flow-performance-v11130.css' service-worker.js
          grep -q './assets/js/modules/flow-performance-v11130.js' service-worker.js
          grep -q 'erp_x_vsm_people' supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          grep -q 'potentialDeadSeconds' supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          grep -q 'effectiveOccupationPct' supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          grep -q 'estimateAccuracyPct' supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          grep -q 'tasksPerEffectiveHour' supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          grep -q 'peopleWithActivity' supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          grep -q 'Tiempo muerto potencial' assets/js/modules/flow-performance-v11130.js
          grep -q 'KPIs por usuario' assets/js/modules/flow-performance-v11130.js
          grep -q 'Confiabilidad del dato' assets/js/modules/flow-performance-v11130.js

      - name: Validate static references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('.')
          missing=[]
          index=(root/'index.html').read_text(encoding='utf-8')
          for spec in re.findall(r'(?:src|href)="(\./[^"?#]+)',index):
              p=root/spec[2:]
              if not p.exists(): missing.append(f'index.html: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec=='./': continue
              p=root/spec[2:]
              if not p.exists(): missing.append(f'service-worker.js: {spec}')
          if missing:
              print('\n'.join(missing))
              sys.exit(1)
          PY

      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.13.0" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.13.0-people-analytics
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90
