name: Audit remediation V11.8.1

on:
  push:
    branches:
      - "fix/v11.8.1-audit-remediation-20260904"

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: "fix/v11.8.1-audit-remediation-20260904"
      - name: Normalize temporary script delimiter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit_remediation_v1181.py')
          s=p.read_text()
          s=s.replace("migration = r'''", 'migration = r"""', 1)
          marker="revoke execute on function public.erp_x_inventory_scan_resolve(text) from anon;\n'''\nPath(\"supabase/migrations/075_audit_contract_hardening_v11_8_1.sql\").write_text(migration)"
          replacement='revoke execute on function public.erp_x_inventory_scan_resolve(text) from anon;\n"""\nPath("supabase/migrations/075_audit_contract_hardening_v11_8_1.sql").write_text(migration)'
          if marker not in s:
              raise SystemExit('No se encontró delimitador final esperado')
          p.write_text(s.replace(marker,replacement,1))
          PY
      - name: Apply audited fixes
        run: python scripts/audit_remediation_v1181.py
      - name: Validate JavaScript and release markers
        shell: bash
        run: |
          set -euo pipefail
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          test -s templates/historical_orders.csv
          grep -q '11.8.1' assets/js/config.js
          grep -q 'crm-suministros-v11-8-1-20260904' service-worker.js
      - name: Commit audited fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "JEPTAC Audit Bot"
          git config user.email "j.perez@ei.com.co"
          git add assets/js/modules/imports.js assets/js/modules/credit.js assets/js/modules/receiving-hub-v115.js assets/js/main.js assets/js/config.js index.html service-worker.js templates/historical_orders.csv supabase/migrations/075_audit_contract_hardening_v11_8_1.sql
          git commit -m "CRM Suministros V11.8.1: remediación de auditoría"
          git push origin HEAD:fix/v11.8.1-audit-remediation-20260904
