name: Prepare Anime UI vendors (temporary)
on:
  push:
    branches: [feat/crm-animate-ui-design-20261014]
permissions:
  contents: write
concurrency:
  group: crm-animate-ui-builder
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Pin Anime.js
        run: npm install --save-exact animejs@4.5.0
      - name: Build same-origin JS libraries
        run: npm run motion:bundle
      - name: Regenerate deterministic PWA
        run: |
          npm run pwa:generate
          npm run pwa:check
      - name: Commit assets and lockfile
        run: |
          set -eu
          git add package.json package-lock.json assets/js/shared/motion/vendor-anime.js assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(ui): pin Anime.js and refresh local motion bundles/PWA'
          git push origin HEAD:feat/crm-animate-ui-design-20261014
