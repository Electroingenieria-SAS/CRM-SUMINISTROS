name: Validate CRM Suministros V11.12.0 Branch

on:
  push:
    branches: [flow-times-v11-12-0]

permissions:
  contents: read

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate static dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  candidate=(path.parent/spec).resolve()
                  if not candidate.exists():
                      missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec=='./':
                  continue
              candidate=root/spec[2:]
              if not candidate.exists():
                  missing.append(f'service-worker.js: {spec}')
          if missing:
              print('Referencias estáticas inexistentes:')
              print('\n'.join(missing))
              sys.exit(1)
          PY

      - name: Execute V11.12.0 release contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/validate-crm.yml').read_text(encoding='utf-8')
          marker='      - name: Validate V11.12.0 release contract\n        shell: bash\n        run: |\n'
          if marker not in source:
              raise SystemExit('No se encontró el contrato V11.12.0 en validate-crm.yml')
          block=source.split(marker,1)[1].split('\n      - name:',1)[0]
          lines=[]
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/v11120-release-contract.sh').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          bash /tmp/v11120-release-contract.sh

      - name: Package branch artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.12.0" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt

      - name: Preserve branch artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.12.0-branch-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 30