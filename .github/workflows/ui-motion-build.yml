name: Refresh freight motion PWA assets (temporary)
on:
  push:
    branches: [feat/freight-motion-ui-system-20261013]
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regenerate deterministic PWA manifest
        run: node scripts/ci/generate-precache-manifest.mjs
      - name: Verify budget and source counts
        run: node scripts/ci/generate-precache-manifest.mjs --check && node scripts/architecture/check-asset-budget.mjs
      - name: Commit updated manifest and SW
        run: |
          set -euo pipefail
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): regenerate cache after safe material replacement'
          git push origin HEAD:feat/freight-motion-ui-system-20261013
