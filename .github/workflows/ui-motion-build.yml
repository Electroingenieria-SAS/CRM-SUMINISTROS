name: Prepare motion ESM and PWA (temporary)
on:
  push:
    branches:
      - feat/freight-motion-ui-system-20261013
permissions:
  contents: write
concurrency:
  group: ui-motion-deps-generation
  cancel-in-progress: true
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Resolve exact pinned dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci --no-fund
      - name: Compile same-origin ESM
        run: npm run vendor:build
      - name: Regenerate PWA inventory
        run: npm run pwa:generate
      - name: Check budgets and reproducibility
        run: npm run vendor:check && npm run pwa:check
      - name: Commit only reproducible vendor and manifest files
        run: |
          set -euo pipefail
          git add package-lock.json assets/js/vendor/ui-animations.js assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(ui): pin vendored ESM and refresh service worker'
          git push origin HEAD:feat/freight-motion-ui-system-20261013
