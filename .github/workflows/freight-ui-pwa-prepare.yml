name: Refresh quote PWA cache (temporary)
on:
  push:
    branches:
      - fix/freight-ui-simplification-20261013
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node scripts/ci/generate-precache-manifest.mjs
      - name: Commit generated PWA manifest
        run: |
          set -eu
          git add assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): finalize compact freight UI cache'
          git push origin HEAD:fix/freight-ui-simplification-20261013
