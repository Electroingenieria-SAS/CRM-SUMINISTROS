name: Local route cascade precache sync
on:
  push:
    branches:
      - fix/local-freight-category-destination-cascade-20261015
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[precache-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Regenerate canonical offline assets
        run: npm run pwa:generate
      - name: Commit generated-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(pwa): sync local category cascade assets [precache-sync]"
          git push origin HEAD:fix/local-freight-category-destination-cascade-20261015
