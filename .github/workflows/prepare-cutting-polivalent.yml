name: Preparar rol polivalente en Corte y PWA
on:
  push:
    branches:
      - feat/cutting-dual-role-picker-20261105

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cutting-dual-role-picker-20261105
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxis JS
        run: |
          node --check assets/js/modules/cutting-flow.js
          node --check assets/js/domains/picking/picking-controller.js
          node --check assets/js/domains/picking/pickup/cut-pickup-stage.js
      - name: Probar asignación y ocupación de Corte
        run: node --test scripts/tests/cutting-dual-role-pickup.test.mjs
      - name: Regenerar manifiesto PWA canónico
        run: npm run pwa:generate
      - name: Publicar manifiesto y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-cutting-polivalent.yml
          git add -A assets/precache-manifest.json service-worker.js .github/workflows/prepare-cutting-polivalent.yml
          git diff --cached --quiet && { echo "Sin cambios de PWA o preparador"; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(pwa): actualizar recursos de rol polivalente en Corte"
          git push origin HEAD:feat/cutting-dual-role-picker-20261105
