name: Package CRM Suministros V11.8

on:
  push:
    branches:
      - ops/v118-deploy-package

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Admin Edge CORS
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/cors-body -D /tmp/cors-headers -w "%{http_code}" -X OPTIONS \
            'https://hezjxcxxcjlpmyalftam.supabase.co/functions/v1/erp-admin-users' \
            -H 'Origin: https://crm-suministros-amber.vercel.app' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type')
          echo "CORS_STATUS=$STATUS"
          grep -i '^access-control-allow-origin:' /tmp/cors-headers || true
          grep -i '^access-control-allow-methods:' /tmp/cors-headers || true
          test "$STATUS" = "204"
          grep -qi '^access-control-allow-origin: https://crm-suministros-amber.vercel.app' /tmp/cors-headers
      - name: Build static package
        run: |
          set -euo pipefail
          rm -rf deploy
          mkdir -p deploy
          cp index.html 404.html manifest.webmanifest service-worker.js deploy/
          cp -R assets deploy/assets
          cd deploy
          zip -r ../crm-suministros-v11.8-static.zip .
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.8-static
          path: crm-suministros-v11.8-static.zip
          if-no-files-found: error
          retention-days: 3
