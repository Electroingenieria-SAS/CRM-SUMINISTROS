name: Refresh premium motion PWA (temporary)
on:
  push:
    branches: [feat/freight-motion-system-20261014]
permissions:
  contents: write
concurrency:
  group: freight-motion-pwa-refresh
  cancel-in-progress: true
jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate and check PWA revision
        run: |
          npm run pwa:generate
          npm run pwa:check
      - name: Commit generated files
        run: |
          set -eu
          git add assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): publish motion module final revision'
          git push origin HEAD:feat/freight-motion-system-20261014
