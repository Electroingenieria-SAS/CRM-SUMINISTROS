name: Refresh PWA manifest on isolated PR branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'fix/reception-lot-origin-for-picking' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild canonical precache manifest
        run: npm run pwa:generate
      - name: Commit generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/precache-manifest.json service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "build(pwa): regenerate canonical precache manifest for lot selection"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
