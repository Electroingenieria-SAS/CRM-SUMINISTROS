name: Preparar eliminación definitiva de aprobación por metrajes
on:
  push:
    branches:
      - fix/cutting-remove-meterage-approval-20261104

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cutting-remove-meterage-approval-20261104
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerar manifest PWA canónico
        run: npm run pwa:generate
      - name: Probar ausencia de aprobación
        run: node --test scripts/tests/cutting-no-remainder-approval.test.mjs
      - name: Sincronizar manifest y retirar workflow temporal
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-cut-no-approval.yml
          git add -A assets/precache-manifest.json service-worker.js .github/workflows/prepare-cut-no-approval.yml
          git diff --cached --quiet && { echo "No se produjeron cambios para publicar"; exit 1; }
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build(pwa): actualizar caché Corte sin autorización y retirar preparador"
          git push origin HEAD:fix/cutting-remove-meterage-approval-20261104
