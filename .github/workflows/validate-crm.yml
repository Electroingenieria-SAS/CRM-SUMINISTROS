name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate static dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  candidate=(path.parent/spec).resolve()
                  if not candidate.exists():
                      missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec in ('./',):
                  continue
              candidate=root/spec[2:]
              if not candidate.exists():
                  missing.append(f'service-worker.js: {spec}')
          if missing:
              print('Referencias estáticas inexistentes:')
              print('\n'.join(missing))
              sys.exit(1)
          PY
      - name: Validate V11.9.4 release contract
        shell: bash
        run: |
          set -euo pipefail
          test -s templates/historical_orders.csv
          test -s assets/css/audit-v1182.css
          test -s assets/css/audit-v1183.css
          test -s assets/css/ui-v1184.css
          test -s assets/css/dashboard-v1185.css
          test -s assets/css/commercial-v1187.css
          test -s assets/css/commercial-v1188.css
          test -s assets/css/operational-lists-v1189.css
          test -s assets/css/popup-ux-v1190.css
          test -s assets/css/order-create-v1191.css
          test -s assets/css/receiving-order-v1192.css
          test -s assets/css/receiving-focus-v1193.css
          test -s assets/css/receiving-polish-v1194.css
          test -s assets/js/modules/audit.js
          test -s assets/js/modules/dashboard.js
          test -s assets/js/modules/orders.js
          test -s assets/js/modules/credit.js
          test -s assets/js/modules/pagination-v1184.js
          test -s assets/js/modules/commercial-v1187.js
          test -s assets/js/modules/commercial-records-v1188.js
          test -s assets/js/modules/popup-ux-v1190.js
          test -s assets/js/modules/order-create-v1191.js
          test -s assets/js/modules/receiving-order-v1192.js
          test -s assets/js/modules/receiving-focus-v1193.js
          test -s assets/js/modules/receiving-polish-v1194.js
          test -s supabase/migrations/081_audit_dashboard_v11_8_2.sql
          test -s supabase/migrations/083_order_type_labels_v11_9_1.sql
          grep -q 'version: "11.9.4"' assets/js/config.js
          grep -q 'build: "2026-09-04.15"' assets/js/config.js
          grep -q 'v=11.9.4' index.html
          grep -q 'receiving-polish-v1194.css?v=11.9.4' index.html
          grep -q 'receiving-polish-v1194.js?v=11.9.4' index.html
          grep -q 'crm-suministros-v11-9-4-20260904' service-worker.js
          grep -q './assets/css/receiving-polish-v1194.css' service-worker.js
          grep -q './assets/js/modules/receiving-polish-v1194.js' service-worker.js
          grep -q 'width:min(1120px,calc(100vw - 56px))!important' assets/css/receiving-polish-v1194.css
          grep -q 'font-size:24px!important' assets/css/receiving-polish-v1194.css
          grep -q 'modal-task-panel-shell' assets/css/receiving-polish-v1194.css
          grep -q 'Cerrar y tomar otro' assets/js/modules/receiving-polish-v1194.js
          grep -q 'RECEPCION_PEDIDO' assets/js/modules/receiving-polish-v1194.js
          grep -q 'dataset.receptionNext' assets/js/modules/receiving-polish-v1194.js
          grep -q 'Siguiente' assets/js/modules/receiving-polish-v1194.js
          grep -q 'reception-take-focus-v1193' assets/js/modules/receiving-focus-v1193.js
          grep -q 'Ver resumen del pedido' assets/js/modules/receiving-focus-v1193.js
          grep -q 'Confirmar y enviar a alistamiento' assets/js/modules/receiving-focus-v1193.js
          grep -q 'reception-now-v1192' assets/css/receiving-order-v1192.css
          grep -q 'Todo está correcto' assets/js/modules/receiving-order-v1192.js
          grep -q 'Revisar con PDF' assets/js/modules/receiving-order-v1192.js
          grep -q 'client-extra-choice-v1191' assets/css/order-create-v1191.css
          grep -q '¿Quiere agregar más datos del cliente?' assets/js/modules/order-create-v1191.js
          grep -q 'ORDER_TYPES=new Set' assets/js/modules/order-create-v1191.js
          grep -q "set name = code" supabase/migrations/083_order_type_labels_v11_9_1.sql
          grep -q 'popup-process-guide-v1190' assets/css/popup-ux-v1190.css
          grep -q 'popup-validation-v1190' assets/js/modules/popup-ux-v1190.js
          grep -q 'prefers-reduced-motion:reduce' assets/css/popup-ux-v1190.css
          grep -q 'compact-order-record-v1188' assets/css/operational-lists-v1189.css
          grep -q 'credit-grid{display:grid;grid-template-columns:1fr' assets/css/operational-lists-v1189.css
          grep -q 'record-figure-v1188' assets/js/modules/commercial-records-v1188.js
          grep -q 'ops-action-card-v1188' assets/css/commercial-v1188.css
          grep -q 'commercial-advanced-filters' assets/js/modules/commercial-v1187.js
          grep -q 'guided-action-icon:after{content:none!important' assets/css/dashboard-v1185.css
          test ! -e assets/js/modules/receiving-v114.js
          test ! -e assets/js/services/drive-bridge.js
          test ! -e assets/js/services/drive-oauth.js
          test ! -e assets/css/receiving-v114.css
      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.9.4" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt
      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.9.4-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90
