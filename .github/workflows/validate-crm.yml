name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets/js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: ES module dependency graph
        run: node --experimental-vm-modules scripts/link-check.mjs

      - name: Security contract
        id: security
        continue-on-error: true
        shell: bash
        run: node scripts/security-check.mjs 2>&1 | tee security-check.log

      - name: Preserve security diagnostics
        if: steps.security.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: security-check-diagnostics
          path: security-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce security contract
        if: steps.security.outcome == 'failure'
        run: exit 1

      - name: Canonical architecture contract
        run: node scripts/validate.mjs

      - name: Release invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "11.23.2"' assets/js/config.js
          grep -q 'build: "2026-09-09.03"' assets/js/config.js
          grep -q '"version": "11.23.2"' package.json
          grep -q 'app-entry.js?v=11.23.2' index.html
          test "$(grep -c '<link rel="stylesheet" href="./assets/css/' index.html)" -eq 4
          test "$(find assets/css -maxdepth 1 -type f -name '*.css' | wc -l)" -eq 4

          for css in core-shell operations analytics experience; do
            test -s "assets/css/${css}.css"
            grep -q "./assets/css/${css}.css" service-worker.js
          done

          grep -q 'Fuente consolidada: app.css' assets/css/core-shell.css
          grep -q 'Fuente consolidada: inventory-core-v11110.css' assets/css/operations.css
          grep -q 'Fuente consolidada: shipping-core-v11107.css' assets/css/operations.css
          grep -q 'Fuente consolidada: flow-times-core-v11120.css' assets/css/analytics.css
          grep -q 'Fuente consolidada: reports-enterprise-v11140.css' assets/css/analytics.css
          grep -q 'Fuente consolidada: admin-center-v11160.css' assets/css/analytics.css
          grep -q 'Fuente consolidada: responsive-foundation-v11190.css' assets/css/experience.css
          grep -q 'Fuente consolidada: paco-assistant-v11200.css' assets/css/experience.css
          grep -q 'grid-template-columns:repeat(auto-fit,minmax(340px,1fr))' assets/css/core-shell.css
          grep -q 'grid-template-columns:minmax(0,1fr) auto' assets/css/operations.css
          grep -q 'max-width:1120px' assets/css/operations.css

          test "$(grep -c '<script type="module" src="./assets/js/' index.html)" -eq 1
          grep -q 'import "./main.js";' assets/js/app-entry.js
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
          grep -q '"main"[[:space:]]*:[[:space:]]*true' vercel.json
          grep -q '"\*"[[:space:]]*:[[:space:]]*false' vercel.json
          test -s .vercelignore

          test -s supabase/migrations/094_architecture_core_cleanup_v11_21_0.sql
          test -s supabase/migrations/095_inventory_accounting_blind_count_v11_23_0.sql
          test -s supabase/migrations/096_inventory_express_super_admin_review_v11_23_1.sql
          test -s supabase/migrations/097_restore_inventory_control_plan_v11_23_2.sql
          for core in confirm_picking_round_core execute_cut_group_core resolve_cut_requirement_core work_my_day_core vsm_people_core; do
            grep -q "erp_supply.${core}" supabase/migrations/094_architecture_core_cleanup_v11_21_0.sql
          done
          for contract in inventory_count_reports erp_x_inventory_count_submit erp_x_inventory_count_review erp_x_inventory_count_plan erp_x_inventory_count_center inventory_count_is_blind_operator; do
            grep -q "$contract" supabase/migrations/095_inventory_accounting_blind_count_v11_23_0.sql
          done
          grep -q 'erp_x_inventory_express_reports' supabase/migrations/096_inventory_express_super_admin_review_v11_23_1.sql
          grep -q "erp_supply.has_role('super_admin')" supabase/migrations/096_inventory_express_super_admin_review_v11_23_1.sql
          grep -q 'inventory_count_schedule_core' supabase/migrations/097_restore_inventory_control_plan_v11_23_2.sql
          grep -q 'remainingToday' supabase/migrations/097_restore_inventory_control_plan_v11_23_2.sql
          grep -q "v_engine->''plan''" supabase/migrations/097_restore_inventory_control_plan_v11_23_2.sql
          grep -q 'drop function if exists public.erp_x_inventory_cycle_count' supabase/migrations/095_inventory_accounting_blind_count_v11_23_0.sql
          grep -q 'drop function if exists public.erp_x_inventory_cycle_control' supabase/migrations/095_inventory_accounting_blind_count_v11_23_0.sql

          grep -Fxq '// previous-cache: crm-suministros-v11-23-1-20260909-02' service-worker.js
          grep -Fxq 'const CACHE="crm-suministros-v11-23-2-20260909-03";' service-worker.js
          grep -q 'Plan de conteos' assets/js/modules/inventory.js
          grep -q 'PARETO ADAPTATIVO' assets/js/modules/inventory-plan-v11232.js
          grep -q 'Pendientes hoy' assets/js/modules/inventory-plan-v11232.js
          grep -q 'Conteo exprés' assets/js/modules/inventory.js
          grep -q 'erp_x_inventory_express_reports' assets/js/services/inventory.js

          for file in \
            assets/js/modules/inventory.js \
            assets/js/modules/inventory-operator-v11230.js \
            assets/js/modules/inventory-plan-v11232.js \
            assets/js/modules/inventory-review-v11230.js \
            assets/js/modules/inventory-stock-v11230.js \
            assets/js/modules/inventory-control-v11230.js \
            assets/js/modules/shipping-flow.js \
            assets/js/modules/cutting-flow.js \
            assets/js/modules/vsm.js \
            assets/js/modules/reports-enterprise-v11140.js \
            assets/js/modules/history-center-v11150.js \
            assets/js/modules/admin.js \
            assets/js/modules/paco-assistant-v11200.js; do
            test -s "$file"
          done
          test ! -e assets/js/modules/inventory-stock.js
          test ! -e assets/js/modules/inventory-cycle-v11220.js
          test ! -e assets/js/modules/inventory-control-v11220.js

      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js vercel.json dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' \
            "commit=${GITHUB_SHA}" \
            "version=11.23.2" \
            "build=2026-09-09.03" \
            "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist-deployable/BUILD_INFO.txt

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.23.2-build03-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90