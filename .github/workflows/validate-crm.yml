name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate static dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  candidate=(path.parent/spec).resolve()
                  if not candidate.exists():
                      missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec=='./':
                  continue
              candidate=root/spec[2:]
              if not candidate.exists():
                  missing.append(f'service-worker.js: {spec}')
          if missing:
              print('Referencias estáticas inexistentes:')
              print('\n'.join(missing))
              sys.exit(1)
          PY

      - name: Validate V11.10.7 release contract
        shell: bash
        run: |
          set -euo pipefail

          test -s assets/css/shipping-core-v11107.css
          test -s assets/css/shipping-guide-reader-v11101.css
          test -s assets/js/modules/shipping-flow.js
          test -s assets/js/modules/shipping-guide-reader-v11101.js
          test -s assets/js/modules/support-flow.js
          test -s assets/js/modules/order-cancellation.js
          test -s assets/js/services/document-reader-v11101.js
          test -s assets/js/services/drive.js

          grep -q 'version: "11.10.7"' assets/js/config.js
          grep -q 'build: "2026-09-07.01"' assets/js/config.js

          grep -q 'shipping-core-v11107.css?v=11.10.7' index.html
          grep -q 'shipping-guide-reader-v11101.css?v=11.10.7' index.html
          grep -q 'shipping-guide-reader-v11101.js?v=11.10.7' index.html
          grep -q 'main.js?v=11.10.7' index.html

          ! grep -q 'shipping-focus-v11101.css' index.html
          ! grep -q 'shipping-workflow-v11102.css' index.html
          ! grep -q 'shipping-scale-v11103.css' index.html
          ! grep -q 'shipping-secondary-v11105.css' index.html
          ! grep -q 'shipping-focus-v11101.js' index.html
          ! grep -q 'shipping-workflow-v11102.js' index.html
          ! grep -q 'shipping-scale-v11103.js' index.html
          ! grep -q 'shipping-secondary-v11105.js' index.html
          ! grep -q 'shipping-next-v11106.js' index.html
          ! grep -q 'api-getorder-dedupe-v11106.js' index.html

          grep -q 'data-shipping-close-another' assets/js/modules/shipping-flow.js
          grep -q 'data-shipping-next-core' assets/js/modules/shipping-flow.js
          grep -q 'bindFooter' assets/js/modules/shipping-flow.js
          grep -q 'navigate(moduleForStep(step)' assets/js/modules/shipping-flow.js
          grep -q 'await reload' assets/js/modules/shipping-flow.js
          ! grep -q 'parallelWorkFooter' assets/js/modules/shipping-flow.js
          ! grep -q 'MutationObserver' assets/js/modules/shipping-flow.js

          grep -q 'data-order-support-slot' assets/js/modules/shipping-flow.js
          grep -q 'data-order-cancellation-slot' assets/js/modules/shipping-flow.js
          grep -q 'data-order-support-slot' assets/js/modules/support-flow.js
          grep -q 'data-order-cancellation-slot' assets/js/modules/order-cancellation.js

          grep -q 'carrierInvoiceNumberV11101' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'carrierCostV11101' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'min="0.01"' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'application/pdf,.pdf,image/\*,.csv,text/csv' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'readDocumentText' assets/js/modules/shipping-guide-reader-v11101.js

          grep -q '1400px' assets/css/shipping-core-v11107.css
          grep -q 'safe-area-inset-bottom' assets/css/shipping-core-v11107.css
          grep -q 'shipping-core-footer-v11107' assets/css/shipping-core-v11107.css

          grep -q 'crm-suministros-v11-10-7-20260907' service-worker.js
          grep -q './assets/css/shipping-core-v11107.css' service-worker.js
          grep -q './assets/css/shipping-guide-reader-v11101.css' service-worker.js
          grep -q './assets/js/modules/shipping-flow.js' service-worker.js
          grep -q './assets/js/modules/shipping-guide-reader-v11101.js' service-worker.js
          ! grep -q './assets/css/shipping-focus-v11101.css' service-worker.js
          ! grep -q './assets/css/shipping-workflow-v11102.css' service-worker.js
          ! grep -q './assets/css/shipping-scale-v11103.css' service-worker.js
          ! grep -q './assets/css/shipping-secondary-v11105.css' service-worker.js
          ! grep -q './assets/js/modules/shipping-next-v11106.js' service-worker.js
          ! grep -q './assets/js/modules/api-getorder-dedupe-v11106.js' service-worker.js

          grep -q 'operationProgress' assets/js/services/drive.js
          grep -q 'Subiendo a Drive' assets/js/modules/global-progress-v11100.js
          grep -q 'El CRM sigue trabajando' assets/js/modules/global-progress-v11100.js

          test ! -e assets/js/modules/receiving-v114.js
          test ! -e assets/js/services/drive-bridge.js
          test ! -e assets/js/services/drive-oauth.js
          test ! -e assets/css/receiving-v114.css

      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.10.7" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.10.7-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90
