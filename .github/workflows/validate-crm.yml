name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: crm-suministros-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: JavaScript syntax
        run: bash scripts/ci/check-javascript-syntax.sh

      - name: ES module dependency graph
        run: node --experimental-vm-modules scripts/link-check.mjs

      - name: Workforce planner · business calendar contract
        run: node scripts/workforce-planner-test.mjs

      - name: Workforce today · automatic execution contract
        run: node scripts/workforce-today-test.mjs

      - name: Workforce manager · time review contract
        run: node scripts/workforce-manager-review-test.mjs

      - name: Workforce catalog · hierarchy and safe start contract
        run: node scripts/workforce-catalog-hierarchy-test.mjs

      - name: Workforce UX · accessibility and touch contract
        run: node scripts/workforce-accessibility-test.mjs

      - name: Workforce timeline · unified calendar, evidence and storage contract
        run: node scripts/workforce-timeline-test.mjs

      - name: Workforce calendar · root architecture and evidence performance
        run: node scripts/workforce-calendar-v11360-test.mjs

      - name: Workforce indicators · visual analytics contract
        run: node scripts/workforce-indicators-v11363-test.mjs

      - name: Workforce · automatic order occupation contract
        run: node scripts/workforce-order-automation-v11380-test.mjs

      - name: Orders · workflow stage status contract
        run: node scripts/order-stage-status-v11381-test.mjs

      - name: Orders · active-step responsible + seller contract
        run: node scripts/order-responsible-seller-v11382-test.mjs

      - name: Customer + freight intelligence contract
        run: node scripts/customer-freight-intelligence-v11390-test.mjs

      - name: Freight predictive model · 749 historical shipments
        run: node scripts/freight-prediction-v11400-test.mjs

      - name: Logistics intelligence · prediction vs actual
        run: node scripts/logistics-intelligence-v11410-test.mjs

      - name: Freight historical base · immediate activation
        run: node scripts/freight-historical-base-v11420-test.mjs

      - name: Freight cards layout · responsive grid
        run: node scripts/freight-cards-layout-v11430-test.mjs

      - name: PACO · operational assistant contract
        run: node scripts/paco-operational-v11370-test.mjs

      - name: PACO · typo and CRM language training corpus
        run: node scripts/paco-language-v11373-test.mjs

      - name: Security contract
        id: security
        continue-on-error: true
        shell: bash
        run: node scripts/security-check.mjs 2>&1 | tee security-check.log

      - name: Preserve security diagnostics
        if: steps.security.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: security-check-diagnostics
          path: security-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce security contract
        if: steps.security.outcome == 'failure'
        run: exit 1

      - name: Historical secret scan
        run: npm run security:history

      - name: Canonical architecture contract
        run: node scripts/validate.mjs && node scripts/architecture/check-domain-boundaries.mjs

      - name: Integration contract · CRM → AuditoriaERP Recepción
        run: node scripts/integration-contract-check.mjs

      - name: Migration provenance / DR ledger
        run: npm run db:ledger

      - name: Release invariants
        run: bash scripts/ci/release-invariants.sh

      - name: Domain regressions and modular CSS
        run: npm run validate:domains

      - name: PWA asset provenance and source budget
        run: npm run pwa:check

      - name: Install browser smoke runner
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium webkit

      - name: Browser smoke · public shell + XSS trust boundary
        run: npx playwright test tests/smoke.spec.js tests/domain-refactor.spec.js tests/responsive-refactor.spec.js --project=chromium --project=mobile --project=iphone --project=tablet --grep-invert "authenticated shell, critical modules and native API"

      - name: Package deployable frontend
        run: bash scripts/ci/package-frontend.sh

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: crm-suministros-v11.43.0-build37-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-deployable

  authenticated-e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ERP_TEST_EMAIL: ${{ secrets.ERP_QA_EMAIL }}
      ERP_TEST_PASSWORD: ${{ secrets.ERP_QA_PASSWORD }}
    steps:
      - name: QA credentials preflight
        id: qa-credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ERP_TEST_EMAIL:-}" && -n "${ERP_TEST_PASSWORD:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated E2E enabled."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Authenticated E2E skipped: configure ERP_QA_EMAIL and ERP_QA_PASSWORD to enable this release gate."
          fi

      - name: Checkout
        if: steps.qa-credentials.outputs.available == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.qa-credentials.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install browser E2E runner
        if: steps.qa-credentials.outputs.available == 'true'
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        if: steps.qa-credentials.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Authenticated E2E release gate · critical modules
        if: steps.qa-credentials.outputs.available == 'true'
        run: npx playwright test tests/smoke.spec.js --project=chromium --project=mobile --grep "authenticated shell, critical modules and native API"

  deploy-pages:
    name: deploy-pages
    concurrency:
      group: crm-suministros-github-pages
      cancel-in-progress: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, authenticated-e2e, secret-scan, supply-chain, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy CRM to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TruffleHog · verified secrets
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          extra_args: --results=verified

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze JavaScript/TypeScript
        uses: github/codeql-action/analyze@v4


  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: NPM audit · high severity gate
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > crm-suministros-sbom.cdx.json

      - name: Preserve SBOM
        uses: actions/upload-artifact@v7
        with:
          name: crm-suministros-v11.43.0-sbom
          path: crm-suministros-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
