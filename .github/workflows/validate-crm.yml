name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate static dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  if not (path.parent/spec).resolve().exists(): missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec!='./' and not (root/spec[2:]).exists(): missing.append(f'service-worker.js: {spec}')
          if missing:
              print('\n'.join(missing));sys.exit(1)
          PY

      - name: Validate V11.19.1 release contract
        shell: bash
        run: |
          set -euo pipefail

          # Release identity.
          grep -q 'version: "11.19.1"' assets/js/config.js
          grep -q 'build: "2026-09-08.05"' assets/js/config.js
          grep -q 'main.js?v=11.19.1' index.html
          grep -q 'responsive-foundation-v11190.css?v=11.19.0' index.html
          grep -q 'paco-enterprise-v11191.css?v=11.19.1' index.html
          grep -q 'paco-visual-v11191.js?v=11.19.1' index.html
          grep -q 'paco-command-center-v11191.js?v=11.19.1' index.html
          grep -q 'interactive-widget=resizes-content' index.html
          grep -q 'crm-suministros-v11-19-1-20260908-05' service-worker.js

          # Responsive Foundation V11.19.0 remains canonical.
          test -s assets/css/responsive-foundation-v11190.css
          test -s assets/js/modules/responsive-foundation-v11190.js
          test -s docs/responsive-matrix-v11.19.0.md
          grep -q 'Responsive Foundation V11.19.0' assets/css/responsive-foundation-v11190.css
          grep -q 'safe-area-inset-top' assets/css/responsive-foundation-v11190.css
          grep -q '@media(max-width:1180px)' assets/css/responsive-foundation-v11190.css
          grep -q '@media(max-width:720px)' assets/css/responsive-foundation-v11190.css
          grep -q '@media(max-width:480px)' assets/css/responsive-foundation-v11190.css
          grep -q '@media(max-width:360px)' assets/css/responsive-foundation-v11190.css
          grep -q 'orientation:landscape' assets/css/responsive-foundation-v11190.css
          grep -q 'pointer:coarse' assets/css/responsive-foundation-v11190.css
          grep -q 'prefers-reduced-motion' assets/css/responsive-foundation-v11190.css
          grep -q '100dvh' assets/css/responsive-foundation-v11190.css
          grep -q 'mobile-dock' assets/css/responsive-foundation-v11190.css
          grep -q 'rf-responsive-table' assets/css/responsive-foundation-v11190.css
          grep -q 'data-rf-mode="cards"' assets/css/responsive-foundation-v11190.css
          grep -q 'data-rf-mode="scroll"' assets/css/responsive-foundation-v11190.css
          grep -q 'visualViewport' assets/js/modules/responsive-foundation-v11190.js
          grep -q 'MutationObserver' assets/js/modules/responsive-foundation-v11190.js
          grep -q 'data-rf-label' assets/js/modules/responsive-foundation-v11190.js
          grep -q 'MOBILE_NAV_QUERY="(max-width: 1180px)"' assets/js/core/layout.js
          grep -q 'mobileDockHtml' assets/js/core/layout.js
          grep -q '320×568' docs/responsive-matrix-v11.19.0.md
          grep -q '1024×768' docs/responsive-matrix-v11.19.0.md
          grep -q '1366×768' docs/responsive-matrix-v11.19.0.md
          grep -q '1920×1080' docs/responsive-matrix-v11.19.0.md

          # Global aesthetic shell remains mandatory.
          test -s assets/css/paco-aesthetic-v11180.css
          test -s assets/css/paco-aesthetic-depth-v11180.css
          test -s assets/img/ui/crm-psp-waves-v11180.webp
          grep -q 'crm-psp-waves-v11180.webp' assets/css/paco-aesthetic-v11180.css
          grep -q 'Sidebar premium texture' assets/css/paco-aesthetic-v11180.css

          # Paco baseline functional engine remains permission controlled.
          test -s assets/js/modules/paco-bot-v11182.js
          test -s assets/js/modules/paco-visibility-v11180.js
          grep -q 'api.listOrders' assets/js/modules/paco-bot-v11182.js
          grep -q 'api.getActions' assets/js/modules/paco-bot-v11182.js
          grep -q 'api.orderIssues' assets/js/modules/paco-bot-v11182.js
          grep -q 'api.health' assets/js/modules/paco-bot-v11182.js
          grep -q 'auth.updateUser' assets/js/modules/paco-bot-v11182.js
          grep -q 'hasRole("super_admin")' assets/js/modules/paco-bot-v11182.js
          grep -q 'PACO_VERSION="11.19.1"' assets/js/modules/paco-visibility-v11180.js
          grep -q 'paco-enterprise-v11191.css?v=11.19.1' assets/js/modules/paco-visibility-v11180.js

          # Paco V11.19.1: taller panel, circular dock and real-image rolling motion.
          test -s assets/css/paco-enterprise-v11191.css
          test -s assets/js/modules/paco-visual-v11191.js
          for asset in idle listening thinking wink talking success; do
            test -s "assets/img/paco/paco-${asset}-v11183.svg"
          done
          grep -q 'PACO_ASSETS' assets/js/modules/paco-visual-v11191.js
          grep -q 'HTMLImageElement' assets/js/modules/paco-visual-v11191.js
          grep -q 'width+gap' assets/js/modules/paco-visual-v11191.js || grep -q 'const desired=width+gap' assets/js/modules/paco-visual-v11191.js
          grep -q 'paco-open-v11191' assets/js/modules/paco-visual-v11191.js
          grep -q 'rotate(-720deg)' assets/css/paco-enterprise-v11191.css
          grep -q 'border-radius:50%' assets/css/paco-enterprise-v11191.css
          grep -q 'content:"⚡"' assets/css/paco-enterprise-v11191.css
          grep -q 'height:min(760px,calc(100dvh - 42px))' assets/css/paco-enterprise-v11191.css
          grep -q 'pacoTrailV11191' assets/css/paco-enterprise-v11191.css
          grep -q 'object-fit:contain' assets/css/paco-enterprise-v11191.css
          grep -q 'prefers-reduced-motion' assets/css/paco-enterprise-v11191.css

          # Paco Command Center: real read-only diagnostics and permission-aware shortcuts.
          test -s assets/js/modules/paco-command-center-v11191.js
          grep -q 'Centro de herramientas' assets/js/modules/paco-command-center-v11191.js
          grep -q 'api.listOrders' assets/js/modules/paco-command-center-v11191.js
          grep -q 'api.exceptionSummary' assets/js/modules/paco-command-center-v11191.js
          grep -q 'api.workMyDay' assets/js/modules/paco-command-center-v11191.js
          grep -q 'api.materialReservationHealth' assets/js/modules/paco-command-center-v11191.js
          grep -q 'api.health' assets/js/modules/paco-command-center-v11191.js
          grep -q 'erp:rpc-error' assets/js/modules/paco-command-center-v11191.js
          grep -q 'Mi acceso' assets/js/modules/paco-command-center-v11191.js
          grep -q 'Pedidos a revisar' assets/js/modules/paco-command-center-v11191.js
          grep -q 'Salud del CRM' assets/js/modules/paco-command-center-v11191.js
          grep -q 'paco-command-center-v11191' assets/css/paco-enterprise-v11191.css

          # Corte V11.17.0 regression baseline.
          test -s assets/css/cutting-center-v11170.css
          test -s assets/js/modules/cutting-flow.js
          grep -q 'cutting-page-head' assets/css/cutting-center-v11170.css
          grep -q 'cutting-guided-modal' assets/css/cutting-center-v11170.css
          grep -q 'api.cuttingWork' assets/js/modules/cutting-flow.js
          grep -q 'api.executeCutGroup' assets/js/modules/cutting-flow.js
          grep -q 'api.cuttingFinalize' assets/js/modules/cutting-flow.js

          # Administration V11.16.0 contract remains mandatory.
          test -s assets/css/admin-center-v11160.css
          test -s assets/js/modules/admin-center-v11160.js
          test -s supabase/migrations/092_admin_control_center_v11_16_0.sql
          grep -q 'Centro de Control Administrativo' assets/js/modules/admin-center-v11160.js
          grep -q 'erp_x_admin_control_center' assets/js/modules/admin-center-v11160.js
          grep -q 'erp_x_admin_config_mutate' assets/js/modules/admin-center-v11160.js

          # Super Admin profile verification / isolated impersonation session.
          test -s supabase/functions/erp-admin-impersonate/index.ts
          test -s supabase/migrations/093_admin_impersonation_audit_v11_16_0.sql
          grep -q 'erp-admin-impersonate' assets/js/modules/admin.js
          grep -q 'Entrar como usuario' assets/js/modules/admin.js
          grep -q 'IMPERSONATION_MODE' assets/js/services/supabase.js
          grep -q 'verifyOtp' assets/js/services/supabase.js

          # Historical center and Analytics regression contracts.
          test -s assets/css/history-center-v11150.css
          test -s assets/js/modules/history-center-v11150.js
          test -s supabase/migrations/091_history_center_v11_15_0.sql
          grep -q 'Centro Histórico de Pedidos' assets/js/modules/history-center-v11150.js
          test -s assets/css/reports-enterprise-v11140.css
          test -s assets/js/modules/reports-enterprise-v11140.js
          test -s supabase/migrations/088_reports_analytics_core_v11_14_0.sql
          test -s supabase/migrations/089_reports_explorer_export_views_v11_14_0.sql
          test -s supabase/migrations/090_reports_analytics_indexes_v11_14_0.sql
          grep -q 'Intelligence Center' assets/js/modules/reports-enterprise-v11140.js

          # Regression contracts retained from V11.11–V11.13.
          test -s assets/css/inventory-core-v11110.css
          test -s assets/js/modules/inventory.js
          test -s assets/js/services/inventory.js
          test -s supabase/migrations/084_inventory_traceability_v11_10_9.sql
          test -s assets/css/shipping-core-v11107.css
          test -s assets/css/sent-orders-v11108.css
          test -s assets/js/modules/shipping-flow.js
          test -s assets/js/modules/sent-orders.js
          test -s assets/css/flow-times-core-v11120.css
          test -s assets/js/modules/vsm.js
          test -s supabase/migrations/085_flow_times_analytics_v11_12_0.sql
          test -s assets/css/flow-performance-v11130.css
          test -s assets/js/modules/flow-performance-v11130.js
          test -s supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          test -s supabase/migrations/087_people_analytics_profile_selector_v11_13_0.sql

          # PWA contains the canonical V11.19.1 Paco and V11.19.0 responsive runtime.
          grep -q './assets/css/responsive-foundation-v11190.css' service-worker.js
          grep -q './assets/js/modules/responsive-foundation-v11190.js' service-worker.js
          grep -q './assets/css/paco-enterprise-v11191.css' service-worker.js
          grep -q './assets/js/modules/paco-bot-v11182.js' service-worker.js
          grep -q './assets/js/modules/paco-visual-v11191.js' service-worker.js
          grep -q './assets/js/modules/paco-command-center-v11191.js' service-worker.js
          for asset in idle listening thinking wink talking success; do
            grep -q "./assets/img/paco/paco-${asset}-v11183.svg" service-worker.js
          done

          # Vercel quota guard: only main may auto-deploy.
          grep -q '"main"[[:space:]]*:[[:space:]]*true' vercel.json
          grep -q '"\*"[[:space:]]*:[[:space:]]*false' vercel.json

      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.19.1" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.19.1-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90
