name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find assets/js scripts -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: ES module dependency graph
        run: node --experimental-vm-modules scripts/link-check.mjs

      - name: Security contract
        id: security
        continue-on-error: true
        shell: bash
        run: node scripts/security-check.mjs 2>&1 | tee security-check.log

      - name: Preserve security diagnostics
        if: steps.security.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: security-check-diagnostics
          path: security-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce security contract
        if: steps.security.outcome == 'failure'
        run: exit 1

      - name: Canonical architecture contract
        run: node scripts/validate.mjs

      - name: Release invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "11.26.0"' assets/js/config.js
          grep -q 'build: "2026-09-10.01"' assets/js/config.js
          grep -q '"version": "11.26.0"' package.json
          grep -q 'app-entry.js?v=11.26.0' index.html
          grep -Fxq '// previous-cache: crm-suministros-v11-25-3-20260909-08' service-worker.js
          grep -Fxq 'const CACHE="crm-suministros-v11-26-0-20260910-01";' service-worker.js
          test "$(grep -c '<link rel="stylesheet" href="./assets/css/' index.html)" -eq 4
          test "$(find assets/css -maxdepth 1 -type f -name '*.css' | wc -l)" -eq 4

          for css in core-shell operations analytics experience; do
            test -s "assets/css/${css}.css"
            grep -q "./assets/css/${css}.css" service-worker.js
          done

          test "$(grep -c '<script type="module" src="./assets/js/' index.html)" -eq 1
          grep -q 'import "./main.js";' assets/js/app-entry.js
          grep -q 'import "./modules/inventory-dialogs-v11260.js";' assets/js/app-entry.js
          ! grep -q 'inventory-modal-v11253.js' assets/js/app-entry.js
          ! grep -q 'inventory-modal-workspace-v11254.js' assets/js/app-entry.js
          test ! -e assets/js/modules/inventory-modal-v11253.js
          test ! -e assets/js/modules/inventory-modal-workspace-v11254.js
          test "$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | wc -l)" -eq 1
          grep -q '"main"[[:space:]]*:[[:space:]]*true' vercel.json
          grep -q '"\*"[[:space:]]*:[[:space:]]*false' vercel.json

          for file in \
            assets/js/modules/inventory.js \
            assets/js/modules/inventory-ui-v11240.js \
            assets/js/modules/inventory-dialogs-v11260.js \
            assets/js/modules/inventory-home-v11250.js \
            assets/js/modules/inventory-operator-v11250.js \
            assets/js/modules/inventory-plan-v11250.js \
            assets/js/modules/inventory-review-v11250.js \
            assets/js/modules/inventory-stock-v11250.js \
            assets/js/modules/inventory-ledger-v11250.js \
            assets/js/modules/inventory-control-v11250.js \
            assets/js/modules/inventory-export-v11250.js; do
            test -s "$file"
          done

          grep -q 'inventory-nav-v11251' assets/js/modules/inventory.js
          grep -q 'inventory-audit-card-v11251' assets/js/modules/inventory-review-v11250.js
          grep -q 'inventory-comparison-row-v11251' assets/js/modules/inventory-review-v11250.js
          grep -q 'Aprobar y aplicar' assets/js/modules/inventory-review-v11250.js
          grep -q 'REGISTRAR CONTEO' assets/js/modules/inventory-operator-v11250.js
          grep -q 'PARETO ADAPTATIVO' assets/js/modules/inventory-plan-v11250.js
          grep -q 'Actualizar Siesa' assets/js/modules/inventory-stock-v11250.js
          grep -q 'KARDEX' assets/js/modules/inventory-ledger-v11250.js
          grep -q 'inventory-enterprise-row-v11252' assets/js/modules/inventory-ui-v11240.js

          # Contrato UX V11.26: un solo sistema, ancho contenido y accesibilidad táctil/visual.
          grep -q 'inventory-dialog-v11260' assets/js/modules/inventory-dialogs-v11260.js
          grep -q 'inventory-dialog-guide-v11260' assets/js/modules/inventory-dialogs-v11260.js
          grep -q -- '--inventory-dialog-width:1120px' assets/js/modules/inventory-dialogs-v11260.js
          grep -q -- '--inventory-dialog-width:720px' assets/js/modules/inventory-dialogs-v11260.js
          grep -q -- '--inventory-dialog-width:1040px' assets/js/modules/inventory-dialogs-v11260.js
          grep -q 'min-height:48px' assets/js/modules/inventory-dialogs-v11260.js
          grep -q 'font-size:16px' assets/js/modules/inventory-dialogs-v11260.js
          grep -q 'grid-template-columns:repeat(3,minmax(0,1fr))' assets/js/modules/inventory-dialogs-v11260.js
          grep -q 'MutationObserver' assets/js/modules/inventory-dialogs-v11260.js
          ! grep -q 'width:min(86vw' assets/js/modules/inventory-dialogs-v11260.js
          ! grep -q 'width:min(88vw' assets/js/modules/inventory-dialogs-v11260.js
          ! grep -q 'width:min(94vw' assets/js/modules/inventory-dialogs-v11260.js

      - name: Install browser smoke runner
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: npm install --no-save --no-package-lock @playwright/test@1.63.0

      - name: Install Chromium
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      - name: Browser smoke · public shell
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: npx playwright test tests/smoke.spec.js --project=chromium --grep "login shell renders"

      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js vercel.json dist-deployable/
          cp -R assets templates dist-deployable/
          touch dist-deployable/.nojekyll
          printf '%s\n' \
            "commit=${GITHUB_SHA}" \
            "version=11.26.0" \
            "build=2026-09-10.01" \
            "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > dist-deployable/BUILD_INFO.txt

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.26.0-build01-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare GitHub Pages preview artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-deployable

  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy CRM preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
