name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate static dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  if not (path.parent/spec).resolve().exists(): missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec!='./' and not (root/spec[2:]).exists(): missing.append(f'service-worker.js: {spec}')
          if missing:
              print('\n'.join(missing));sys.exit(1)
          PY

      - name: Validate V11.15.0 release contract
        shell: bash
        run: |
          set -euo pipefail

          # Release identity.
          grep -q 'version: "11.15.0"' assets/js/config.js
          grep -q 'build: "2026-09-07.08"' assets/js/config.js
          grep -q 'main.js?v=11.15.0' index.html
          grep -q 'history-center-v11150.css?v=11.15.0' index.html
          grep -q 'crm-suministros-v11-15-0-20260907' service-worker.js

          # Historical center contract.
          test -s assets/css/history-center-v11150.css
          test -s assets/js/modules/history-center-v11150.js
          grep -q 'history-center-v11150.js' assets/js/modules/imports.js
          grep -q 'Centro Histórico de Pedidos' assets/js/modules/history-center-v11150.js
          grep -q 'Archivo consolidado' assets/js/modules/history-center-v11150.js
          grep -q 'Lotes históricos' assets/js/modules/history-center-v11150.js
          grep -q 'Integridad documental' assets/js/modules/history-center-v11150.js
          grep -q 'erp_x_history_center' assets/js/modules/history-center-v11150.js
          grep -q 'erp_x_history_detail' assets/js/modules/history-center-v11150.js
          grep -q 'erp_x_history_batches' assets/js/modules/history-center-v11150.js
          grep -q 'erp_x_history_export' assets/js/modules/history-center-v11150.js
          grep -q 'XLSX.writeFile' assets/js/modules/history-center-v11150.js
          grep -q '5000' assets/js/modules/history-center-v11150.js
          grep -q 'Archivo histórico, expedientes, importaciones y trazabilidad' assets/js/main.js

          # Historical database contract.
          test -s supabase/migrations/091_history_center_v11_15_0.sql
          grep -q 'history_center_core' supabase/migrations/091_history_center_v11_15_0.sql
          grep -q 'history_detail_core' supabase/migrations/091_history_center_v11_15_0.sql
          grep -q 'history_batches_core' supabase/migrations/091_history_center_v11_15_0.sql
          grep -q 'history_export_core' supabase/migrations/091_history_center_v11_15_0.sql
          grep -q "can_access_module('imports','read')" supabase/migrations/091_history_center_v11_15_0.sql
          grep -q 'ya existe como registro operativo' supabase/migrations/091_history_center_v11_15_0.sql
          grep -q 'importBatchId' supabase/migrations/091_history_center_v11_15_0.sql

          # V11.14 analytics remains a mandatory regression baseline.
          test -s assets/css/reports-enterprise-v11140.css
          test -s assets/js/modules/reports-enterprise-v11140.js
          test -s supabase/migrations/088_reports_analytics_core_v11_14_0.sql
          test -s supabase/migrations/089_reports_explorer_export_views_v11_14_0.sql
          test -s supabase/migrations/090_reports_analytics_indexes_v11_14_0.sql
          grep -q 'Intelligence Center' assets/js/modules/reports-enterprise-v11140.js
          grep -q 'erp_x_reports_analytics' assets/js/modules/reports-enterprise-v11140.js

          # Regression contracts retained from V11.11–V11.13.
          test -s assets/css/inventory-core-v11110.css
          test -s assets/js/modules/inventory.js
          test -s assets/js/services/inventory.js
          test -s supabase/migrations/084_inventory_traceability_v11_10_9.sql
          test -s assets/css/shipping-core-v11107.css
          test -s assets/css/sent-orders-v11108.css
          test -s assets/js/modules/shipping-flow.js
          test -s assets/js/modules/sent-orders.js
          test -s assets/css/flow-times-core-v11120.css
          test -s assets/js/modules/vsm.js
          test -s supabase/migrations/085_flow_times_analytics_v11_12_0.sql
          test -s assets/css/flow-performance-v11130.css
          test -s assets/js/modules/flow-performance-v11130.js
          test -s supabase/migrations/086_people_performance_analytics_v11_13_0.sql
          test -s supabase/migrations/087_people_analytics_profile_selector_v11_13_0.sql

          # PWA must preserve current modules and include History V11.15.0.
          grep -q './assets/css/flow-times-core-v11120.css' service-worker.js
          grep -q './assets/css/flow-performance-v11130.css' service-worker.js
          grep -q './assets/css/reports-enterprise-v11140.css' service-worker.js
          grep -q './assets/css/history-center-v11150.css' service-worker.js
          grep -q './assets/js/modules/vsm.js' service-worker.js
          grep -q './assets/js/modules/flow-performance-v11130.js' service-worker.js
          grep -q './assets/js/modules/reports-enterprise-v11140.js' service-worker.js
          grep -q './assets/js/modules/history-center-v11150.js' service-worker.js

      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.15.0" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.15.0-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90
