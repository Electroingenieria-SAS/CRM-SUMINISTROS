name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate static dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  candidate=(path.parent/spec).resolve()
                  if not candidate.exists():
                      missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec in ('./',):
                  continue
              candidate=root/spec[2:]
              if not candidate.exists():
                  missing.append(f'service-worker.js: {spec}')
          if missing:
              print('Referencias estáticas inexistentes:')
              print('\n'.join(missing))
              sys.exit(1)
          PY
      - name: Validate V11.8.3 release contract
        shell: bash
        run: |
          set -euo pipefail
          test -s templates/historical_orders.csv
          test -s assets/css/audit-v1182.css
          test -s assets/css/audit-v1183.css
          test -s assets/js/modules/audit.js
          test -s supabase/migrations/081_audit_dashboard_v11_8_2.sql
          grep -q 'version: "11.8.3"' assets/js/config.js
          grep -q 'v=11.8.3' index.html
          grep -q 'audit-v1183.css?v=11.8.3' index.html
          grep -q 'crm-suministros-v11-8-3-20260904' service-worker.js
          grep -q './assets/css/audit-v1183.css' service-worker.js
          grep -q './assets/js/modules/audit.js' service-worker.js
          test ! -e assets/js/modules/receiving-v114.js
          test ! -e assets/js/services/drive-bridge.js
          test ! -e assets/js/services/drive-oauth.js
          test ! -e assets/css/receiving-v114.css
      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.8.3" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt
      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.8.3-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90
