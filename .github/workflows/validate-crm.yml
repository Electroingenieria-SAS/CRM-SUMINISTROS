name: Validate CRM Suministros

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        shell: bash
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate static dependency graph
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  candidate=(path.parent/spec).resolve()
                  if not candidate.exists():
                      missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec=='./':
                  continue
              candidate=root/spec[2:]
              if not candidate.exists():
                  missing.append(f'service-worker.js: {spec}')
          if missing:
              print('Referencias estáticas inexistentes:')
              print('\n'.join(missing))
              sys.exit(1)
          PY

      - name: Validate V11.12.0 release contract
        shell: bash
        run: |
          set -euo pipefail

          # Inventario V11.11.0: contrato de regresión retenido.
          test -s assets/css/inventory-core-v11110.css
          test -s assets/css/inventory-scan-v116.css
          test -s assets/js/modules/inventory.js
          test -s assets/js/modules/inventory-scan-v116.js
          test -s assets/js/services/inventory.js
          test -s supabase/migrations/084_inventory_traceability_v11_10_9.sql
          test ! -e assets/css/inventory-core-v11109.css

          # Shipping: contrato de regresión retenido.
          test -s assets/css/shipping-core-v11107.css
          test -s assets/css/shipping-guide-reader-v11101.css
          test -s assets/css/sent-orders-v11108.css
          test -s assets/js/modules/shipping-flow.js
          test -s assets/js/modules/sent-orders.js
          test -s assets/js/modules/shipping-guide-reader-v11101.js
          test -s assets/js/modules/support-flow.js
          test -s assets/js/modules/order-cancellation.js
          test -s assets/js/services/document-reader-v11101.js
          test -s assets/js/services/drive.js

          # Flujo y tiempos V11.12.0.
          test -s assets/css/flow-times-core-v11120.css
          test -s assets/js/modules/vsm.js
          test -s supabase/migrations/085_flow_times_analytics_v11_12_0.sql

          # Identidad global de release. Las versiones internas de módulos previos se conservan.
          grep -q 'version: "11.12.0"' assets/js/config.js
          grep -q 'build: "2026-09-07.05"' assets/js/config.js
          grep -q 'inventory-core-v11110.css?v=11.11.0' index.html
          grep -q 'inventory-scan-v116.css?v=11.11.0' index.html
          grep -q 'inventory-scan-bootstrap-v116.js?v=11.11.0' index.html
          grep -q 'flow-times-core-v11120.css?v=11.12.0' index.html
          grep -q 'main.js?v=11.12.0' index.html
          ! grep -q 'inventory-core-v11109.css' index.html

          # Contrato funcional de Flujo y tiempos.
          grep -q 'Flujo y tiempos V11.12.0' assets/js/modules/vsm.js
          grep -q 'flowEfficiencyPct' assets/js/modules/vsm.js
          grep -q 'atRisk' assets/js/modules/vsm.js
          grep -q 'slowestOrders' assets/js/modules/vsm.js
          grep -q 'flow-map-v11120' assets/js/modules/vsm.js
          grep -q 'flow-verification-v11120' assets/js/modules/vsm.js
          grep -q 'Flujo y tiempos V11.12.0' assets/css/flow-times-core-v11120.css
          grep -q '.flow-summary-v11120' assets/css/flow-times-core-v11120.css
          grep -q '.flow-map-v11120' assets/css/flow-times-core-v11120.css
          grep -q '.flow-node-v11120' assets/css/flow-times-core-v11120.css
          grep -q 'erp_x_vsm' supabase/migrations/085_flow_times_analytics_v11_12_0.sql
          grep -q 'flowEfficiencyPct' supabase/migrations/085_flow_times_analytics_v11_12_0.sql
          grep -q "can_access_module('vsm','read')" supabase/migrations/085_flow_times_analytics_v11_12_0.sql
          grep -q "revoke execute on function public.erp_x_vsm(date,date) from public,anon" supabase/migrations/085_flow_times_analytics_v11_12_0.sql
          grep -q "grant execute on function public.erp_x_vsm(date,date) to authenticated" supabase/migrations/085_flow_times_analytics_v11_12_0.sql

          # Inventario: regresiones funcionales y visuales.
          grep -q 'api.inventoryFiltered' assets/js/modules/inventory.js
          grep -q 'inventory-list-head-v11109' assets/js/modules/inventory.js
          grep -q 'data-inventory-detail' assets/js/modules/inventory.js
          grep -q 'Lotes y ubicaciones' assets/js/modules/inventory.js
          grep -q 'Movimientos' assets/js/modules/inventory.js
          grep -q 'inventoryMovements' assets/js/modules/inventory.js
          grep -q 'Conteo físico' assets/js/modules/inventory.js
          grep -q 'PHYSICAL_COUNT' assets/js/modules/inventory.js
          grep -q 'data-v116-scan' assets/js/modules/inventory.js
          grep -q 'data-v116-item-labels' assets/js/modules/inventory.js
          ! grep -q 'official-inventory-card' assets/js/modules/inventory.js
          ! grep -q 'inventory-grid official-inventory-grid' assets/js/modules/inventory.js
          ! grep -q 'function cards' assets/js/modules/inventory.js
          ! grep -q 'choice("movementType","TRANSFER"' assets/js/modules/inventory.js
          ! grep -q 'MutationObserver' assets/js/modules/inventory.js

          grep -q 'erp_x_inventory_movements' assets/js/services/inventory.js
          grep -q 'erp_x_inventory_movements' supabase/migrations/084_inventory_traceability_v11_10_9.sql
          grep -q 'idx_inventory_movements_item_created_v11109' supabase/migrations/084_inventory_traceability_v11_10_9.sql
          grep -q 'idx_inventory_movements_lot_created_v11109' supabase/migrations/084_inventory_traceability_v11_10_9.sql

          grep -q 'Inventario final V11.11.0' assets/css/inventory-core-v11110.css
          grep -q 'inventory-summary-v11109' assets/css/inventory-core-v11110.css
          grep -q 'inventory-list-head-v11109' assets/css/inventory-core-v11110.css
          grep -q 'position:sticky' assets/css/inventory-core-v11110.css
          grep -q 'inventory-detail-tabs-v11109' assets/css/inventory-core-v11110.css
          grep -q 'inventory-lot-row-v11109' assets/css/inventory-core-v11110.css
          grep -q 'inventory-movement-head-v11109' assets/css/inventory-core-v11110.css
          grep -q 'inventory-movement-row-v11109' assets/css/inventory-core-v11110.css
          grep -q 'inventory-count-v11109' assets/css/inventory-core-v11110.css
          grep -q 'inventory-count-summary-v11109' assets/css/inventory-core-v11110.css
          grep -q 'focus-visible' assets/css/inventory-core-v11110.css
          grep -q '@media(max-width:980px)' assets/css/inventory-core-v11110.css
          grep -q '@media(max-width:680px)' assets/css/inventory-core-v11110.css
          grep -q 'prefers-reduced-motion' assets/css/inventory-core-v11110.css

          # Shipping: versiones y ausencia de capas obsoletas.
          grep -q 'shipping-core-v11107.css?v=11.10.8' index.html
          grep -q 'sent-orders-v11108.css?v=11.10.8' index.html
          grep -q 'shipping-guide-reader-v11101.css?v=11.10.7' index.html
          grep -q 'shipping-guide-reader-v11101.js?v=11.10.7' index.html

          ! grep -q 'shipping-focus-v11101.css' index.html
          ! grep -q 'shipping-workflow-v11102.css' index.html
          ! grep -q 'shipping-scale-v11103.css' index.html
          ! grep -q 'shipping-secondary-v11105.css' index.html
          ! grep -q 'shipping-focus-v11101.js' index.html
          ! grep -q 'shipping-workflow-v11102.js' index.html
          ! grep -q 'shipping-scale-v11103.js' index.html
          ! grep -q 'shipping-secondary-v11105.js' index.html
          ! grep -q 'shipping-next-v11106.js' index.html
          ! grep -q 'api-getorder-dedupe-v11106.js' index.html

          grep -q 'data-shipping-close-another' assets/js/modules/shipping-flow.js
          grep -q 'data-shipping-next-core' assets/js/modules/shipping-flow.js
          grep -q 'bindFooter' assets/js/modules/shipping-flow.js
          grep -q 'navigate(moduleForStep(step)' assets/js/modules/shipping-flow.js
          grep -q 'await reload' assets/js/modules/shipping-flow.js
          ! grep -q 'parallelWorkFooter' assets/js/modules/shipping-flow.js
          ! grep -q 'MutationObserver' assets/js/modules/shipping-flow.js

          grep -q 'data-order-support-slot' assets/js/modules/shipping-flow.js
          grep -q 'data-order-cancellation-slot' assets/js/modules/shipping-flow.js
          grep -q 'data-order-support-slot' assets/js/modules/support-flow.js
          grep -q 'data-order-cancellation-slot' assets/js/modules/order-cancellation.js

          grep -q 'from "./sent-orders.js"' assets/js/modules/queue.js
          ! grep -q 'renderSentOrdersPanel.*from "./shipping-flow.js"' assets/js/modules/queue.js
          grep -q 'sent-orders-overview-v11108' assets/js/modules/sent-orders.js
          grep -q 'sent-order-row-v11108' assets/js/modules/sent-orders.js
          grep -q 'Pendiente de confirmar entrega' assets/js/modules/sent-orders.js
          grep -q 'Novedad reportada' assets/js/modules/sent-orders.js
          grep -q 'Sin pendientes' assets/js/modules/sent-orders.js
          grep -q 'data-no-delivery' assets/js/modules/sent-orders.js
          grep -q 'data-open-sent' assets/js/modules/sent-orders.js
          ! grep -q 'sent-order-card' assets/js/modules/sent-orders.js
          ! grep -q 'sent-orders-grid' assets/js/modules/sent-orders.js
          ! grep -q 'MutationObserver' assets/js/modules/sent-orders.js

          grep -q 'carrierInvoiceNumberV11101' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'carrierCostV11101' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'min="0.01"' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'application/pdf,.pdf,image/\*,.csv,text/csv' assets/js/modules/shipping-guide-reader-v11101.js
          grep -q 'readDocumentText' assets/js/modules/shipping-guide-reader-v11101.js

          grep -q '1400px' assets/css/shipping-core-v11107.css
          grep -q 'safe-area-inset-bottom' assets/css/shipping-core-v11107.css
          grep -q 'shipping-core-footer-v11107' assets/css/shipping-core-v11107.css

          # PWA V11.12.0 y precache completo del nuevo módulo.
          grep -q 'previous-cache: crm-suministros-v11-11-0-20260907' service-worker.js
          grep -q 'crm-suministros-v11-12-0-20260907' service-worker.js
          grep -q './assets/css/flow-times-core-v11120.css' service-worker.js
          grep -q './assets/js/modules/vsm.js' service-worker.js
          grep -q './assets/css/inventory-core-v11110.css' service-worker.js
          ! grep -q './assets/css/inventory-core-v11109.css' service-worker.js
          grep -q './assets/js/modules/inventory.js' service-worker.js
          grep -q './assets/js/services/inventory.js' service-worker.js
          grep -q './assets/css/shipping-core-v11107.css' service-worker.js
          grep -q './assets/css/shipping-guide-reader-v11101.css' service-worker.js
          grep -q './assets/css/sent-orders-v11108.css' service-worker.js
          grep -q './assets/js/modules/shipping-flow.js' service-worker.js
          grep -q './assets/js/modules/sent-orders.js' service-worker.js
          grep -q './assets/js/modules/shipping-guide-reader-v11101.js' service-worker.js
          ! grep -q './assets/css/shipping-focus-v11101.css' service-worker.js
          ! grep -q './assets/css/shipping-workflow-v11102.css' service-worker.js
          ! grep -q './assets/css/shipping-scale-v11103.css' service-worker.js
          ! grep -q './assets/css/shipping-secondary-v11105.css' service-worker.js
          ! grep -q './assets/js/modules/shipping-next-v11106.js' service-worker.js
          ! grep -q './assets/js/modules/api-getorder-dedupe-v11106.js' service-worker.js

          grep -q 'operationProgress' assets/js/services/drive.js
          grep -q 'Subiendo a Drive' assets/js/modules/global-progress-v11100.js
          grep -q 'El CRM sigue trabajando' assets/js/modules/global-progress-v11100.js

          test ! -e assets/js/modules/receiving-v114.js
          test ! -e assets/js/services/drive-bridge.js
          test ! -e assets/js/services/drive-oauth.js
          test ! -e assets/css/receiving-v114.css

      - name: Package deployable frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.12.0" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt

      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.12.0-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90