name: Local Dispatch PWA Generate

on:
  push:
    branches:
      - feat/local-dispatch-trip-v1145

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate canonical PWA files
        run: node scripts/ci/generate-precache-manifest.mjs
      - name: Upload generated PWA files
        uses: actions/upload-artifact@v7
        with:
          name: local-dispatch-pwa-generated
          path: |
            assets/precache-manifest.json
            service-worker.js
          if-no-files-found: error
