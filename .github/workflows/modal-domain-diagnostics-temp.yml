name: Diagnosticar regresiones UI
on:
  push:
    branches: [design/erp-popup-visual-refresh-20261104]
    paths: [.github/workflows/modal-domain-diagnostics-temp.yml]
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/erp-popup-visual-refresh-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reproducir suite de dominios sin secretos
        shell: bash
        run: |
          set +e
          npm run validate:domains > domain-tests-output.txt 2>&1
          echo "TEST_EXIT=$?" > domain-tests-diagnostics.txt
          grep -nE 'not ok|ERR_|AssertionError|error:|fail [1-9]|failure|expected|actual' domain-tests-output.txt | head -130 >> domain-tests-diagnostics.txt
          echo '--- FINAL OUTPUT ---' >> domain-tests-diagnostics.txt
          tail -150 domain-tests-output.txt >> domain-tests-diagnostics.txt
          cat domain-tests-diagnostics.txt | tail -60
          exit 0
      - name: Publicar diagnóstico temporal inspeccionable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ux
          mv domain-tests-diagnostics.txt docs/ux/domain-tests-diagnostics-temp.txt
          git add docs/ux/domain-tests-diagnostics-temp.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): diagnóstico temporal de pruebas de dominio"
          git push origin HEAD:design/erp-popup-visual-refresh-20261104
