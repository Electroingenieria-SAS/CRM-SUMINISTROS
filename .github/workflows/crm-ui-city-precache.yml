name: Refresh UI City Picker PWA (temporary)
on:
  push:
    branches: [feat/crm-animate-ui-design-20261014]
permissions:
  contents: write
concurrency:
  group: crm-ui-city-precache
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate and verify PWA assets
        run: |
          npm run pwa:generate
          npm run pwa:check
      - name: Commit deterministic PWA
        run: |
          git add assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): refresh single-city combobox revision'
          git push origin HEAD:feat/crm-animate-ui-design-20261014
