name: Preparar pruebas y activos de actividades
on:
  push:
    branches: [fix/workforce-universal-activities-20261104]
    paths: [.github/workflows/workforce-validation-temp.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/workforce-universal-activities-20261104
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar módulos Workforce
        run: |
          node scripts/workforce-catalog-hierarchy-test.mjs
          node scripts/workforce-today-test.mjs
          node --test scripts/tests/workforce-scheduling-approval.test.mjs scripts/tests/workforce-universal-activities.test.mjs
      - name: Generar manifiesto PWA
        run: npm run pwa:generate
      - name: Registrar nueva revisión
        shell: bash
        run: |
          set -euo pipefail
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(pwa): refrescar activos de jornada universal"
          git push origin HEAD:fix/workforce-universal-activities-20261104
