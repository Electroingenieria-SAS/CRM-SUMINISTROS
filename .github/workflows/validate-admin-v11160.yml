name: Validate CRM Suministros V11.16.0 Admin

on:
  push:
    branches: [admin-center-v11-16-0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate static dependency graph
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re,sys
          root=Path('.')
          missing=[]
          for path in (root/'assets/js').rglob('*.js'):
              text=path.read_text(encoding='utf-8')
              for spec in re.findall(r'(?:from\s+|import\s*\()\s*["\'](\.{1,2}/[^"\']+)["\']',text):
                  if not (path.parent/spec).resolve().exists(): missing.append(f'{path}: {spec}')
          sw=(root/'service-worker.js').read_text(encoding='utf-8')
          for spec in re.findall(r'"(\./[^"?#]+)"',sw):
              if spec!='./' and not (root/spec[2:]).exists(): missing.append(f'service-worker.js: {spec}')
          if missing: print('\n'.join(missing));sys.exit(1)
          PY
      - name: Validate V11.16.0 administrative contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version: "11.16.0"' assets/js/config.js
          grep -q 'build: "2026-09-07.09"' assets/js/config.js
          grep -q 'main.js?v=11.16.0' index.html
          grep -q 'admin-center-v11160.css?v=11.16.0' index.html
          grep -q 'crm-suministros-v11-16-0-20260907' service-worker.js
          test -s assets/css/admin-center-v11160.css
          test -s assets/js/modules/admin-center-v11160.js
          test -s supabase/migrations/092_admin_control_center_v11_16_0.sql
          grep -q 'Centro de Control Administrativo' assets/js/modules/admin-center-v11160.js
          grep -q 'erp_x_admin_control_center' assets/js/modules/admin-center-v11160.js
          grep -q 'erp_x_admin_config_mutate' assets/js/modules/admin-center-v11160.js
          grep -q 'PERMISSION' assets/js/modules/admin-center-v11160.js
          grep -q 'WORKFLOW_STEP' assets/js/modules/admin-center-v11160.js
          grep -q 'CALENDAR_DAY' assets/js/modules/admin-center-v11160.js
          grep -q 'DOCUMENT_SEQUENCE' assets/js/modules/admin-center-v11160.js
          grep -q "set search_path = ''" supabase/migrations/092_admin_control_center_v11_16_0.sql
          grep -q "can_access_module('admin','admin')" supabase/migrations/092_admin_control_center_v11_16_0.sql
          grep -q 'system_audit' supabase/migrations/092_admin_control_center_v11_16_0.sql
          grep -q './assets/css/admin-center-v11160.css' service-worker.js
          grep -q './assets/js/modules/admin-center-v11160.js' service-worker.js
      - name: Package deployable frontend
        shell: bash
        run: |
          mkdir -p dist-deployable
          cp index.html 404.html manifest.webmanifest service-worker.js dist-deployable/
          cp -R assets templates dist-deployable/
          printf '%s\n' "commit=${GITHUB_SHA}" "version=11.16.0" "validated_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist-deployable/BUILD_INFO.txt
      - name: Preserve deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-v11.16.0-admin-deployable
          path: dist-deployable/
          if-no-files-found: error
          retention-days: 90
