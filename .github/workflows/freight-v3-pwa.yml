name: Refresh premium freight V3 PWA (temporary)
on:
  push:
    branches: [fix/freight-cards-layout-503-20261014]
permissions:
  contents: write
concurrency:
  group: freight-v3-asset-revision
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regenerate and validate asset manifests
        run: |
          npm run pwa:generate
          npm run pwa:check
      - name: Commit deterministic cache revision
        run: |
          set -eu
          git add assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): refresh freight premium V3 revision'
          git push origin HEAD:fix/freight-cards-layout-503-20261014
