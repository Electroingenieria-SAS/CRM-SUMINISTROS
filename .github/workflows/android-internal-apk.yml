name: Android APK interno · CRM Suministros

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-internal/**'
      - '.github/workflows/android-internal-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android-internal/**'
      - '.github/workflows/android-internal-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK already on runner
        run: sdkmanager --version
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare signed internal build
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.CRM_ANDROID_KEYSTORE_B64 }}
          SIGNING_STORE_PASS: ${{ secrets.CRM_ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASS: ${{ secrets.CRM_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android-internal/app internal-signing-backup
          keypath="$GITHUB_WORKSPACE/android-internal/app/signing-key.jks"
          if [[ -n "$KEYSTORE_B64" && -n "$SIGNING_STORE_PASS" && -n "$SIGNING_KEY_PASS" ]]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$keypath"
            store_pass="$SIGNING_STORE_PASS"
            key_pass="$SIGNING_KEY_PASS"
            echo "Reusing configured organization signing certificate"
          else
            store_pass="$(openssl rand -hex 24)"
            key_pass="$store_pass"
            keytool -genkeypair -noprompt -keystore "$keypath" -alias crm-interno \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -storepass "$store_pass" -keypass "$key_pass" \
              -dname "CN=CRM Suministros Interno, O=Electroingenieria SAS, C=CO"
            cp "$keypath" internal-signing-backup/signing-key.jks
            printf 'CRM_ANDROID_KEYSTORE_PASSWORD=%s\nCRM_ANDROID_KEY_PASSWORD=%s\n' \
              "$store_pass" "$key_pass" > internal-signing-backup/secretos-firma.txt
            echo "IMPORTANT: save admin signing backup, required for future APK updates"
          fi
          echo "::add-mask::$store_pass"
          echo "::add-mask::$key_pass"
          {
            echo "CRM_ANDROID_KEYSTORE=$keypath"
            echo "CRM_ANDROID_STORE_PASSWORD=$store_pass"
            echo "CRM_ANDROID_KEY_PASSWORD=$key_pass"
          } >> "$GITHUB_ENV"
      - name: Build signed APK
        run: gradle -p android-internal :app:assembleRelease --no-daemon --stacktrace
      - name: Verify signature and generate site association
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android-apk-output
          apk=android-internal/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > android-apk-output/verificacion-firma.txt
          sha256sum "$apk" > android-apk-output/SHA256SUMS.txt
          fingerprint="$(keytool -list -v -keystore "$CRM_ANDROID_KEYSTORE" -alias crm-interno -storepass "$CRM_ANDROID_STORE_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test -n "$fingerprint"
          FINGERPRINT="$fingerprint" python3 - <<'PY'
          import json, os
          obj = [{"relation":["delegate_permission/common.handle_all_urls"],
                  "target":{"namespace":"android_app",
                            "package_name":"co.com.electroingenieria.crmsuministros",
                            "sha256_cert_fingerprints":[os.environ["FINGERPRINT"]]}}]
          with open("android-apk-output/assetlinks.json","w") as f:
              json.dump(obj,f,indent=2)
          PY
          cp "$apk" android-apk-output/CRM-Suministros-Android-Interno-v1.0.0.apk
      - name: Publish signed APK for internal distribution
        uses: actions/upload-artifact@v4
        with:
          name: crm-suministros-android-apk
          path: android-apk-output/
          retention-days: 30
          if-no-files-found: error
      - name: Back up newly generated signing certificate (administrators only)
        if: ${{ hashFiles('internal-signing-backup/signing-key.jks') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: crm-android-signing-admin-backup
          path: internal-signing-backup/
          retention-days: 30
          if-no-files-found: error
