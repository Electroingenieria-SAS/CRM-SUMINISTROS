name: Freight blue action cache sync (temporary)
on:
  push:
    branches: [style/freight-history-blue-actions-20261016]
permissions:
  contents: write
jobs:
  sync:
    if: "!contains(github.event.head_commit.message, '[precache-sync]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run pwa:generate
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(pwa): sync freight blue action stylesheet [precache-sync]"
          git push origin HEAD:style/freight-history-blue-actions-20261016
