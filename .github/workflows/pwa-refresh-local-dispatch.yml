name: PWA Refresh Local Dispatch
on:
  push:
    branches:
      - feat/local-dispatch-trip-v1145

permissions:
  contents: write

jobs:
  refresh:
    if: "!contains(github.event.head_commit.message, '[pwa-refresh]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/local-dispatch-trip-v1145
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Generate canonical PWA manifest
        run: npm run pwa:generate
      - name: Commit generated PWA assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/precache-manifest.json service-worker.js
          if git diff --cached --quiet; then
            echo "PWA already current."
            exit 0
          fi
          git commit -m "chore(pwa): refresh V11.45.0 local dispatch assets [pwa-refresh]"
          git push origin HEAD:feat/local-dispatch-trip-v1145
