name: Refresh selected freight + modal PWA (temporary)
on:
  push:
    branches: [fix/freight-selected-popup-alignment-20261014]
permissions:
  contents: write
concurrency:
  group: freight-popup-pwa-fix
  cancel-in-progress: true
jobs:
  revision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Rebuild deterministic precache and enforce existing PWA limits
        run: |
          npm run pwa:generate
          npm run pwa:check
      - name: Commit only generated PWA assets
        run: |
          set -eu
          git add assets/precache-manifest.json service-worker.js
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(pwa): selected freight and popup alignment cache revision'
          git push origin HEAD:fix/freight-selected-popup-alignment-20261014
