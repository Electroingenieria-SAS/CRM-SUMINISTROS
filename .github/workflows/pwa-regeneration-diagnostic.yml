name: PWA Regeneration Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate exact PWA metadata
        shell: bash
        run: |
          set -euo pipefail
          npm run pwa:generate
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('assets/precache-manifest.json','utf8'));console.log('PWA_REVISION='+m.revision);console.log('PWA_SOURCE_BYTES='+m.sourceBytes);console.log('PWA_ASSET_COUNT='+m.assets.length)"
          grep 'const STATIC_REVISION=' service-worker.js
          npm run pwa:check
